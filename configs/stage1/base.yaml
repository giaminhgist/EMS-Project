# Stage-1 base configuration (Phase 6).
# Recommended starting values are design defaults, not claimed optima.

experiment_name: dino_hc_normative_stage1
ablation: base
seed: 2026
fold: 0

model:
  d_model: 128
  heatmap_patch_size: 4
  heatmap_residual_blocks: 2
  semantic_source: dino
  semantic_adapter: learned_depthwise_2x2
  fusion: serial_attention_spatial_attention
  single_cross_attention: false
  fusion_residual: true
  learn_fusion_gates: true
  attention_heads: 4
  attention_dropout: 0.1
  semantic_gamma_total_init: 0.1
  share_cross_attention_weights: false
  spatial_bridge: residual_dwconv_ffn
  spatial_bridge_expansion_ratio: 2.0
  spatial_bridge_kernel_size: 3
  spatial_bridge_dropout: 0.1
  spatial_bridge_eta_init: 0.1
  pooling: attention
  positional_encoding: fixed_2d_sincos
  input_channels: 3
  active_channels: [0, 1, 2]

masking:
  train_mask_ratio: 0.35
  validation_mask_ratio: 0.35
  reconstruction_scope: masked

loss:
  reconstruction: smooth_l1
  channel_weights: [1.0, 1.0, 1.0]
  normative_metric: loo_cosine
  lambda_norm: 0.1
  norm_start_epoch: 10
  norm_ramp_epochs: 5
  spread_floor: 0.1
  lambda_spread: 5.0

sampler:
  stimuli_per_batch: 8
  hc_per_stimulus: 8
  replacement: false
  min_hc_per_stimulus: 8

optimization:
  epochs: 100
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 5.0e-4
  scheduler: linear_warmup_cosine
  lr_warmup_epochs: 5
  gradient_clip_norm: 5.0
  amp: true

validation:
  selection_metric: val_loss
  best_eligible_after_norm_ramp: true
  early_stopping_patience: 20

runtime:
  num_workers: 0
  pin_memory: true
  persistent_workers: true
  deterministic_validation: true

paths:
  processed_root: /root/EMS-Project/processed_dataset
  dino_root: /root/EMS-Project/stimulus_features/dino_vits16
  cv_fold_dir: /root/EMS-Project/CV/5fold_seed2026/fold_0
  output_root: /root/EMS-Project/outputs/stage1
